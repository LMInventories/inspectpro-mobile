name: Build Dev Client APK

# On-demand debug/dev-client build — see docs/floor-plan/IMPLEMENTATION_PLAN.md blocker 2.
# Mirrors build-android.yml exactly, except:
#   - workflow_dispatch only (not triggered on every push — this is a manual dev tool)
#   - builds the debug variant (assembleDebug) instead of assembleRelease
#   - publishes to a separate, clearly-marked prerelease so it's never confused
#     with a real production release build
#
# Purpose: with expo-dev-client installed, this produces an installable APK that
# connects to a local Metro bundler for fast native-module iteration — without
# this, testing any native change (e.g. the future ARCore module) means a full
# CI run + manual sideload + no JS hot reload, which is impractical.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Dev Client APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node ───────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Java ───────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Android SDK ────────────────────────────────────────────
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      # ── 5. Gradle cache ───────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 6. Install deps ───────────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 7. Prebuild ───────────────────────────────────────────────
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      # Force Gradle version (prevents AGP mismatch)
      - name: Force Gradle wrapper version
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.13

      # Patch AFTER prebuild + wrapper fix
      - name: Apply Gradle patches
        run: |
          node scripts/eas-gradle-patch.js
          echo "Patch applied successfully"

      # ── 8. local.properties ───────────────────────────────────────
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # ── 9. Build debug/dev-client APK ──────────────────────────────
      - name: Build debug APK
        env:
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      # ── 10. Publish as a clearly-marked prerelease ─────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-client-${{ github.run_number }}
          name: Dev Client Build ${{ github.run_number }}
          draft: false
          prerelease: true
          body: |
            Debug/dev-client build #${{ github.run_number }} — requires a Metro
            bundler running (`npx expo start --dev-client`) to connect to.
            Not a production build. Commit: ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
